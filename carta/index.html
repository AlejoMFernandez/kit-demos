<!doctype html>
<!-- Carta pública de la página de prueba (?cliente=br abre la del cliente de Brasil). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Carta</title>
<meta name="description" content="Carta online, siempre actualizada.">
<script>
  // /carta sin barra final rompe las rutas relativas en algunos servidores (XAMPP): la agregamos.
  if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../kit/kit.css?v=1">
<link rel="stylesheet" href="../kit/menu.css?v=1">
</head>
<body>
<div id="kit-menu" class="kit-root kit-menu" aria-busy="true"></div>
<script type="module">
  import { initMenu } from '../kit/modules/menu.js?v=1';
  const c = new URLSearchParams(location.search).get('cliente');
  initMenu({ config: c ? `../cliente-${c}.json` : '../cliente.json', sitio: c ? `../?cliente=${c}` : '../' });
</script>
</body>
</html>
